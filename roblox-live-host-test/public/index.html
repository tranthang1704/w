<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roblox LIVE Host Test</title><script src="/socket.io/socket.io.js"></script><style>body{font-family:Arial;background:#0b0f16;color:#fff;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.panel{background:#151b26;border:1px solid #2a3445;border-radius:16px;padding:18px;margin:14px 0}input,button{padding:12px;border-radius:10px;border:0;margin:4px}input{background:#0c1119;color:#fff;border:1px solid #2a3445}button{background:#60a5fa;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#111722;padding:16px;border-radius:12px}.good{color:#34d399}.bad{color:#fb7185}.event{font-family:monospace;padding:7px;background:#0d121a;margin:4px 0;border-radius:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>Roblox LIVE Host Test</h1><div class="panel"><input id="u" placeholder="TikTok username"><button onclick="connectLive()">Connect LIVE</button><button onclick="startRound()">Start Round</button><button onclick="testBid()">Test +100</button><div id="status"></div></div><div class="stats"><div class="stat">Round<div id="round">0</div></div><div class="stat">Phase<div id="phase">IDLE</div></div><div class="stat">Time<div id="time">0</div></div><div class="stat">Top<div id="top">-</div></div></div><div class="panel"><h3>Leaderboard</h3><div id="bids"></div></div><div class="panel"><h3>Events</h3><div id="events"></div></div></div><script src="/app.js"></script></body></html>
