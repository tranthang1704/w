name: Build TranThag Auto Auction EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'tranthag-auction-app/**'
      - '.github/workflows/build-tranthag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tranthag-auction-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tranthag-auction-app/package.json

      - name: Install
        run: npm install

      - name: Build portable EXE
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify artifact
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse
          if (!(Test-Path "dist/TranThagAPPLIVE_AutoAuction.exe")) { throw "EXE not found" }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TranThagAPPLIVE_AutoAuction
          path: tranthag-auction-app/dist/TranThagAPPLIVE_AutoAuction.exe
          if-no-files-found: error
          retention-days: 30
