name: Build Original TranThag Patched EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'tranthag-original-patch/**'
      - '.github/workflows/build-tranthag-original.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout patch source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download original ASAR
        shell: pwsh
        run: |
          $url = "https://tranthag-auto-auction-test.floot.app/_cdn/static/TranThagAPPLIVE_Animation_Fixed.asar"
          Invoke-WebRequest -Uri $url -OutFile "original.asar"
          Write-Host ("Downloaded bytes: " + (Get-Item "original.asar").Length)
          if ((Get-Item "original.asar").Length -lt 50000000) {
            throw "Original ASAR download is too small."
          }

      - name: Extract original app
        shell: pwsh
        run: |
          npx -y @electron/asar extract original.asar original-app
          if (!(Test-Path "original-app/server.js")) { throw "server.js missing after ASAR extract" }
          if (!(Test-Path "original-app/public/dashboard.js")) { throw "dashboard.js missing after ASAR extract" }

      - name: Patch original features in place
        run: node tranthag-original-patch/patch-original.js original-app

      - name: Add unified board studio
        run: node tranthag-original-patch/add-board-studio.js original-app

      - name: Add live real-gift feed
        run: node tranthag-original-patch/add-live-gift-feed.js original-app

      - name: Add TranThag Local API
        run: node tranthag-original-patch/add-tranthag-local-api.js original-app

      - name: Link TikTok Studio to auto auction board
        run: node tranthag-original-patch/add-studio-auction-link.js original-app

      - name: Prepare package for EXE
        run: node tranthag-original-patch/prepare-package.js original-app/package.json

      - name: Install build dependencies
        working-directory: original-app
        run: npm install

      - name: Build portable EXE
        working-directory: original-app
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify EXE
        shell: pwsh
        run: |
          Get-ChildItem original-app/dist -Recurse
          if (!(Test-Path "original-app/dist/TranThagAPPLIVE_AutoAuction_FULL.exe")) {
            throw "Final EXE not found"
          }

      - name: Upload patched full EXE
        uses: actions/upload-artifact@v4
        with:
          name: TranThagAPPLIVE_AutoAuction_FULL
          path: original-app/dist/TranThagAPPLIVE_AutoAuction_FULL.exe
          if-no-files-found: error
          retention-days: 30
